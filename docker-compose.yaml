# docker-compose.yml
version: '3.9'
services:
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommercedb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql # Persist data across restarts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ecommerce-service:
    build:
      context: ./ecommerce
    container_name: ecommerce-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommercedb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  ecommerce_agent:
    build:
      context: ./ecommerce_agent
    container_name: ecommerce-agent
    ports:
      - "8000:8000"
    env_file:
      - ecommerce_agent/.env
    restart: unless-stopped

volumes:
  mysql-data: